server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # A LINHA MAIS IMPORTANTE deste arquivo.
    #
    # A aplicacao tem uma pagina so, e o React Router troca as telas por
    # JavaScript. Quando alguem esta em /portaria e aperta F5, o navegador
    # pede "/portaria" ao servidor -- e esse arquivo nao existe. Sem esta
    # linha o Nginx devolveria 404 num sistema que funciona.
    #
    # "procure o arquivo; se nao achar, entregue o index.html" -- ai o React
    # carrega, olha a URL e mostra a tela certa.
    try_files $uri $uri/ /index.html;
  }
}
